name: Test ISO image

on:
  workflow_dispatch:
  pull_request:
    paths: &triggering_paths
      # Keep shared inputs aligned with test_nixos_full.yml.
      - .cargo/**
      - .github/actions/test/**
      - Cargo.toml
      - Cargo.lock
      - Components.toml
      - Makefile
      - OSDK.toml
      - VERSION
      - rust-toolchain.toml
      - flake.nix
      - kernel/**
      - ostd/**
      - osdk/**
      - test/initramfs/**
      - test/nixos/Makefile
      - test/nixos/Cargo.toml
      - test/nixos/Cargo.lock
      - test/nixos/common/**
      - test/nixos/tests/hello/**
      # Cargo resolves every member of the NixOS test workspace.
      - test/nixos/tests/*/Cargo.toml
      - tools/qemu_args.sh
      - tools/run_virtiofsd.sh
      - tools/net/**
      - distro/**
      - flake.lock
      - .github/workflows/test_iso_image.yml
      - tools/nixos/**
  push:
    branches:
      - main
    paths: *triggering_paths

jobs:
  iso-test:
    runs-on: ubuntu-4-cores-150GB-ssd
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build Asterinas NixOS ISO installer image
        run: |
          make iso NIXOS_TEST_SUITE=hello
      - name: Run ISO image and install Asterinas NixOS
        run: |
          make run_iso || true
          tail --lines 10 qemu.log | grep -q "^Congratulations!" || (echo "Test ISO failed" && exit 1)
          echo "Test ISO succeeds!"
      - name : Run Asterinas NixOS
        run: |
          make run_nixos NIXOS_TEST_SUITE=hello
