name: 'Test x86-64  '
env:
  CI_CACHE_IMAGE: asterinas/kernel-dev:0.19.0-20261012
jobs:
  basic-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
      - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
      - /usr/local/lib/android:/usr/local/lib/android
      - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      fail-fast: false
      matrix:
        id:
        - compile
    steps:
    - name: Free disk space
      run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
    - uses: actions/checkout@v4
    - name: Run basic tests
      uses: ./.github/actions/test
      with:
        auto_test: general
        cache_image: ${{ env.CI_CACHE_IMAGE }}
        cache_osdk: ${{ vars.CI_CACHE_OSDK != 'false' && matrix.id != 'usermode_test' }}
        cache_kernel: ${{ vars.CI_CACHE_KERNEL != 'false' && matrix.id == 'compile' }}
        cache_save: ${{ matrix.id == 'compile' }}
'on':
  workflow_dispatch: null
  pull_request: null
  push:
    branches:
    - main
