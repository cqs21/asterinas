name: "Test x86-64  "

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-cache:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
    strategy:
      fail-fast: false
      matrix:
        kind: [kernel, ktest]
    steps:
      - uses: actions/checkout@v4
      - name: Restore existing PR cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target/x86_64-unknown-none/debug
            target/debug
          key: kernel-v2-Linux-x86_64-asterinas/kernel-dev:0.19.0-20261012-13dbcb941a5f41d5-b2508d8c9cd57258-x86_64-dev-${{ matrix.kind }}-daefbc7e99a24fa8c1e978c342ba07c5a36e2560
          fail-on-cache-miss: true
      - name: Inspect restored files
        shell: bash
        env:
          CACHE_KIND: ${{ matrix.kind }}
        run: |
          python3 -u - <<'PYCODE'
          import collections, gzip, json, os, re, subprocess
          from pathlib import Path
          roots=[Path('target/x86_64-unknown-none/debug'),Path('target/debug')]
          seen={}; rows=[]; categories=collections.Counter(); executables=[]
          for root in roots:
              for parent, dirs, files in os.walk(root):
                  for name in files:
                      p=Path(parent)/name
                      st=p.stat(); inode=(st.st_dev,st.st_ino); first=seen.get(inode)
                      rel=p.relative_to(root)
                      category=str(root)+'/'+(rel.parts[0] if len(rel.parts)>1 else '(root files)')
                      row={'path':str(p),'bytes':st.st_size,'category':category,'hardlink_to':first}
                      if first is None:
                          seen[inode]=str(p); categories[category]+=st.st_size
                      if str(root).startswith('target/x86_64'):
                          with p.open('rb') as f: magic=f.read(4)
                          if magic==b'\x7fELF' and p.suffix!='.so':
                              executables.append(str(p)); row['guest_elf']=True
                      rows.append(row)
          print('UNCOMPRESSED_UNIQUE_MiB '+json.dumps({k:round(v/2**20,3) for k,v in categories.items()}))
          print('TOP_FILES '+json.dumps(sorted([r for r in rows if r['hardlink_to'] is None],key=lambda r:r['bytes'],reverse=True)[:20]))
          print('GUEST_ELF '+json.dumps([r for r in rows if r.get('guest_elf')]))
          print('TOTAL_UNCOMPRESSED_UNIQUE_MiB '+str(round(sum(categories.values())/2**20,3)))
          # Match the gzip format used for the original caches, and measure all files
          # and the same cache with final guest ELF outputs omitted.
          measurements={}
          for label,exclude in [('all',[]),('without_guest_elf',executables)]:
              archive=Path('/tmp')/('cache-'+label+'.tgz')
              command=['tar','--posix','-czf',str(archive)]
              command.extend('--exclude='+p for p in exclude)
              command.extend(str(p) for p in roots)
              subprocess.run(command,check=True)
              measurements[label]=archive.stat().st_size
              archive.unlink()
          print('GZIP_ARCHIVE_BYTES '+json.dumps(measurements))
          # Inspect debug sections in a linked kernel, the largest rlib, and a proc macro.
          samples=[]
          for selector in [lambda r:r.get('guest_elf'),lambda r:'x86_64-unknown-none' in r['path'] and r['path'].endswith('.rlib'),lambda r:r['path'].endswith('.so')]:
              candidates=[r for r in rows if r['hardlink_to'] is None and selector(r)]
              if candidates: samples.append(max(candidates,key=lambda r:r['bytes']))
          for row in samples:
              result=subprocess.run(['size','-A',row['path']],capture_output=True,text=True,check=True)
              debug=0
              for line in result.stdout.splitlines():
                  parts=line.split()
                  if len(parts)>=2 and parts[0].startswith(('.debug','.zdebug')):
                      debug+=int(parts[1])
              print('DEBUG_SECTIONS '+json.dumps({'path':row['path'],'file_bytes':row['bytes'],'debug_section_bytes':debug}))
          Path('/tmp/cache-inventory-'+os.environ['CACHE_KIND']+'.json').write_text(json.dumps({'rows':rows,'gzip_bytes':measurements,'unique_categories':dict(categories)},indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: cache-inventory-${{ matrix.kind }}
          path: /tmp/cache-inventory-*.json
