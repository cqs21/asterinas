name: 'Test x86-64  '
'on':
  workflow_dispatch: null
  pull_request: null
  push:
    branches:
    - main
env:
  CI_CACHE_IMAGE: asterinas/kernel-dev:0.19.0-20261012
jobs:
  basic-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
      - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
      - /usr/local/lib/android:/usr/local/lib/android
      - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      fail-fast: false
      matrix:
        id:
        - ktest
        first:
        - 'off'
        - 'on'
    steps:
    - name: Free disk space
      run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
    - uses: actions/checkout@v4
    - name: First ktest (${{ matrix.first }})
      uses: ./.github/actions/test
      with:
        auto_test: general
        cache_image: ${{ env.CI_CACHE_IMAGE }}
        cache_osdk: 'true'
        cache_kernel: ${{ matrix.first == 'on' }}
        cache_save: 'true'
    - name: Second ktest (opposite cache setting)
      uses: ./.github/actions/test
      with:
        auto_test: general
        cache_image: ${{ env.CI_CACHE_IMAGE }}
        cache_osdk: 'true'
        cache_kernel: ${{ matrix.first != 'on' }}
        cache_save: 'true'
    env:
      CARGO_INCREMENTAL: '0'
    name: ktest pair (${{ matrix.first }} first)
    timeout-minutes: 25
