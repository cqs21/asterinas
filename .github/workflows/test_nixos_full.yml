# A comprehensive test for NixOS.
#
# This workflow verifies that the basic functionality of popular applications
# works correctly on Asterinas NixOS.
name: Test AsterNixOS (full)

permissions:
  contents: read

on:
  schedule:
    # Schedule to run on every day at 16:00 UTC (00:00 Beijing Time)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: Task ID (suite name) to run, or all.
        required: false
        default: all
        type: string
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-tasks: ${{ steps.select.outputs.has-tasks }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        uses: ./.github/actions/jev-select
        with:
          task-source: .github/jev-ci/tasks/test_nixos_full/
          execution-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changes' || 'all' }}
          requested-task: ${{ inputs.task || 'all' }}
          mode: enforce
          api-key: ${{ secrets.JEV_API_KEY }}
          allow-external-context: 'true'

  run-test-suites:
    name: Test ${{ matrix.suite }}
    needs: select
    if: ${{ needs.select.outputs.has-tasks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-nixos-suite
        timeout-minutes: ${{ matrix.timeout_minutes }}
        with:
          suite: ${{ matrix.suite }}
          disk_size: ${{ matrix.disk_size }}
          test_timeout_minutes: ${{ matrix.test_timeout_minutes }}
