name: 'Test riscv64  '
env:
  CI_CACHE_IMAGE: asterinas/kernel-dev:0.19.0-20261012
jobs:
  basic-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
      - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
      - /usr/local/lib/android:/usr/local/lib/android
      - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      matrix:
        id:
        - compile
        cache:
        - 'off'
        - 'on'
        sample:
        - 1
        - 2
        - 3
      fail-fast: false
    steps:
    - name: Free disk space
      run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
    - uses: actions/checkout@v4
    - name: Run basic tests
      uses: ./.github/actions/test
      with:
        auto_test: general
        arch: riscv64
        cache_image: ${{ env.CI_CACHE_IMAGE }}
        cache_osdk: ${{ matrix.cache == 'on' }}
        cache_kernel: ${{ matrix.cache == 'on' }}
        cache_save: 'true'
    - name: Remove rebuilt targets before archive verification
      if: ${{ matrix.cache == 'on' && matrix.sample == 1 }}
      shell: bash
      run: rm -rf -- target /tmp/ci-osdk-target
    - name: Inspect saved OSDK archive
      if: ${{ matrix.cache == 'on' && matrix.sample == 1 }}
      uses: actions/cache/restore@v6
      with:
        path: '/tmp/ci-osdk-target/release/deps/*

          /tmp/ci-osdk-target/release/build

          /tmp/ci-osdk-target/release/.fingerprint

          !/tmp/ci-osdk-target/release/deps/cargo_osdk-*

          '
        key: osdk-asterinas/kernel-dev:0.19.0-20261012-nightly-2026-07-21-x86_64-${{ github.event.pull_request.base.sha }}
        fail-on-cache-miss: true
    - name: Inspect saved kernel archive
      if: ${{ matrix.cache == 'on' && matrix.sample == 1 }}
      uses: actions/cache/restore@v6
      with:
        path: 'target/riscv64imac-unknown-none-elf/debug/deps/*

          target/riscv64imac-unknown-none-elf/debug/build

          target/riscv64imac-unknown-none-elf/debug/.fingerprint

          !target/riscv64imac-unknown-none-elf/debug/deps/*_osdk_bin-*

          target/debug/deps

          target/debug/build

          target/debug/.fingerprint

          '
        key: kernel-asterinas/kernel-dev:0.19.0-20261012-nightly-2026-07-21-x86_64-riscv64-debug-${{ github.event.pull_request.base.sha
          }}
        fail-on-cache-miss: true
    - name: Verify final executables were excluded
      if: ${{ matrix.cache == 'on' && matrix.sample == 1 }}
      shell: bash
      run: 'test -d /tmp/ci-osdk-target/release/.fingerprint

        test -d target/riscv64imac-unknown-none-elf/debug/.fingerprint

        test ! -e /tmp/ci-osdk-target/release/cargo-osdk

        test ! -e target/riscv64imac-unknown-none-elf/debug/asterinas-osdk-bin

        excluded=$(find /tmp/ci-osdk-target/release/deps target/riscv64imac-unknown-none-elf/debug/deps -type f \( -name ''cargo_osdk-*''
        -o -name ''*_osdk_bin-*'' \) -print)

        test -z "$excluded"

        test ! -d target/debug/incremental

        test ! -d target/riscv64imac-unknown-none-elf/debug/incremental

        du -sh /tmp/ci-osdk-target target/riscv64imac-unknown-none-elf/debug target/debug

        echo ''Saved archives contain dependencies and fingerprints, without final executables or incremental state.''

        '
  integration-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
      - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
      - /usr/local/lib/android:/usr/local/lib/android
      - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      matrix:
        include:
        - test_id: boot-release
          release: true
        cache:
        - 'off'
        - 'on'
      fail-fast: false
    steps:
    - name: Free disk space
      run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
    - uses: actions/checkout@v4
    - name: Run integration tests ${{ (startsWith(matrix.test_id, 'conformance') && 'with LTP') || '' }}
      uses: ./.github/actions/test
      with:
        auto_test: ${{ (startsWith(matrix.test_id, 'boot') && 'boot') || 'conformance' }}
        release: ${{ matrix.release }}
        arch: riscv64
        conformance_test_suite: ltp
        cache_image: ${{ env.CI_CACHE_IMAGE }}
        cache_osdk: ${{ matrix.cache == 'on' }}
        cache_kernel: ${{ matrix.cache == 'on' }}
        cache_save: 'true'
'on':
  pull_request: null
  workflow_dispatch: null
