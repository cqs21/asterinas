name: 'Test riscv64  '
'on':
  workflow_dispatch: null
  pull_request: null
  push:
    branches:
    - main
env:
  CI_CACHE_IMAGE: asterinas/kernel-dev:0.19.0-20261012
jobs:
  basic-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
      - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
      - /usr/local/lib/android:/usr/local/lib/android
      - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      matrix:
        include:
        - id: compile
          profile: debug
          release: '0'
        - id: compile
          profile: release
          release: '1'
      fail-fast: false
    steps:
    - name: Free disk space
      run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
    - uses: actions/checkout@v4
    - name: Build ordinary ${{ matrix.profile }} kernel
      uses: ./.github/actions/test
      with:
        auto_test: general
        arch: riscv64
        cache_image: ${{ env.CI_CACHE_IMAGE }}
        cache_osdk: 'true'
        cache_kernel: 'true'
        cache_save: 'true'
    env:
      RELEASE: ${{ matrix.release }}
