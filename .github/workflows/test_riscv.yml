name: 'Test riscv64  '
env:
  CI_CACHE_IMAGE: asterinas/kernel-dev:0.19.0-20261012
jobs:
  basic-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
      - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
      - /usr/local/lib/android:/usr/local/lib/android
      - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      matrix:
        id:
        - compile
        cache:
        - 'off'
        - 'on'
        sample:
        - 1
        - 2
        - 3
      fail-fast: false
    steps:
    - name: Free disk space
      run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
    - uses: actions/checkout@v4
    - name: Run basic tests
      uses: ./.github/actions/test
      with:
        auto_test: general
        arch: riscv64
        cache_image: ${{ env.CI_CACHE_IMAGE }}
        cache_osdk: ${{ matrix.cache == 'on' }}
        cache_kernel: ${{ matrix.cache == 'on' }}
        cache_save: 'true'
  integration-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
      - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
      - /usr/local/lib/android:/usr/local/lib/android
      - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      matrix:
        include:
        - test_id: boot-release
          release: true
        cache:
        - 'off'
        - 'on'
      fail-fast: false
    steps:
    - name: Free disk space
      run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
    - uses: actions/checkout@v4
    - name: Run integration tests ${{ (startsWith(matrix.test_id, 'conformance') && 'with LTP') || '' }}
      uses: ./.github/actions/test
      with:
        auto_test: ${{ (startsWith(matrix.test_id, 'boot') && 'boot') || 'conformance' }}
        release: ${{ matrix.release }}
        arch: riscv64
        conformance_test_suite: ltp
        cache_image: ${{ env.CI_CACHE_IMAGE }}
        cache_osdk: ${{ matrix.cache == 'on' }}
        cache_kernel: ${{ matrix.cache == 'on' }}
        cache_save: 'true'
'on':
  pull_request: null
  workflow_dispatch: null
