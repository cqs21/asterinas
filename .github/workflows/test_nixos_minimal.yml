# A basic CI test for NixOS.
#
# This workflow is intended to include the most basic test for AsterNixOS.
# It requires only a minimal amount of disk space
# and thus can be run on standard Github runners _for free_.
name: Test AsterNixOS (minimal)

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task ID to run (test_nixos_minimal), or all.
        type: string
        default: all
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        uses: ./.github/actions/jev-select
        with:
          task-source: .github/jev-ci/tasks/test_nixos_minimal.yml
          execution-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'changes' || 'all' }}
          requested-task: ${{ inputs.task || 'all' }}
          mode: enforce
          api-key: ${{ secrets.JEV_API_KEY }}
          allow-external-context: 'true'

  minimal-nixos-test:
    needs: select
    if: ${{ fromJSON(needs.select.outputs.run).test_nixos_minimal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Run the hello test on AsterNixOS
        timeout-minutes: 30
        uses: ./.github/actions/test-nixos-suite
        with:
          suite: hello
          disk_size: 6144
          test_timeout_minutes: 10
