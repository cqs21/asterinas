id: ai-and-machine-learning
description: >
  Required only for implementation changes to the NixOS test code in
  test/nixos/tests/ai-and-machine-learning/
  or changes to its related test code, fixtures, and test configuration.
  Kernel code changes alone do not require this task.
  Documentation, comments, or formatting changes alone do not require this task,
  even inside test source files. A source path alone is insufficient.
force_paths:
  - .github/jev-ci/tasks/test_nixos_full/ai-and-machine-learning.yml
  - book/src/distro/popular-applications/ai-and-machine-learning/test_pytorch.py
  - book/src/distro/popular-applications/ai-and-machine-learning/test_tensorflow.py
  - test/nixos/tests/ai-and-machine-learning/**
execution:
  suite: ai-and-machine-learning
  disk_size: 10240
  timeout_minutes: 45
  test_timeout_minutes: 10
