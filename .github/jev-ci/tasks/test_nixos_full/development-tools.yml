id: development-tools
description: >
  Builds the Asterinas kernel, boots an AsterNixOS image in QEMU, and runs
  test/nixos/tests/development-tools.
  Checks compilers, language runtimes, Git, build tools, GDB/strace debugging, and
  development utilities, including the Book's GDB fixtures.
  Covers guest development packages and the shared NixOS image builder, boot process,
  and host test framework. Extended Go, Python, and OpenJDK regressions have separate tasks.
force_paths:
  - .github/jev-ci/tasks/test_nixos_full/development-tools.yml
  - book/src/distro/popular-applications/development-tools/gdb_commands.gdb
  - book/src/distro/popular-applications/development-tools/gdb_sample.c
  - test/nixos/tests/development-tools/**
execution:
  suite: development-tools
  disk_size: 10240
  timeout_minutes: 45
  test_timeout_minutes: 10
